name: quality:validate (daily, phase 1/2)

on:
  schedule:
    # 07:00 UTC daily -- after YouTube's midnight Pacific quota reset
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      seed_limit:
        description: Census IDs to check directly
        default: '250000'
      direct_units:
        description: YouTube units for the direct census check
        default: '5000'
      validate_limit:
        description: Maximum seeds to validate
        default: '150000'
      validate_units:
        description: Maximum YouTube API units for queued seeds
        default: '2000'

concurrency:
  group: quality-discovery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEY }},${{ secrets.YOUTUBE_API_KEY_2 }},${{ secrets.YOUTUBE_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Census IDs are checked straight from the file (1 unit / 50 IDs); only
      # 5k+ sub channels in US/UK/CA/AU/Europe (or no country) are saved.
      - name: Check next census IDs directly (no seed rows)
        id: stream
        continue-on-error: true
        run: npm run census:direct -- --limit "${{ inputs.seed_limit || '250000' }}" --max-units "${{ inputs.direct_units || '5000' }}"

      # Featured channels of passing creators: ~70% are 10k+ subs vs ~8% of census seeds.
      - name: Discover lookalike creators (~1 unit each)
        continue-on-error: true
        run: npm run discover:lookalikes -- --limit 1000 --max-units 1000

      # Oldest stats first; ~8k channels/day refreshes the whole library every ~30 days.
      - name: Refresh channel stats (~1 unit per 50 channels)
        continue-on-error: true
        run: npm run refresh:stats -- --limit 8000

      # Remaining queue: lookalike seeds (small, ~1-2k/day).
      - name: Validate queued seeds into channels
        run: npm run census:validate -- --limit "${{ inputs.validate_limit || '150000' }}" --max-units "${{ inputs.validate_units || '2000' }}" --formats channel

      - name: Report discovery source failure after processing queued seeds
        if: steps.stream.outcome == 'failure'
        run: |
          echo "::error::Discovery source unavailable. Existing seeds were still validated; saved channels were retained."
          exit 1
