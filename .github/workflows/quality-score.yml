name: quality:score (daily, phase 2/2)

on:
  schedule:
    # 08:15 UTC daily -- ~75min after validate starts, safely past its
    # observed ~20-25min runtime even on a slow day.
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      refresh_units:
        description: YouTube API units for re-checking passing creators (runs first)
        default: '1500'
      score_limit:
        description: Maximum new channels to score
        default: '11000'
      score_units:
        description: YouTube API units for scoring new channels
        default: '12000'

concurrency:
  group: quality-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEY }},${{ secrets.YOUTUBE_API_KEY_2 }},${{ secrets.YOUTUBE_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sellable inventory first: passing creators scored >30 days ago, oldest first.
      - name: Re-check passing creators (freshness)
        continue-on-error: true
        run: npm run score:quality -- --all-countries --refresh-pass --refresh-days 14 --limit 8000 --max-units "${{ inputs.refresh_units || '1500' }}"

      - name: Quality-score new channels (spills across keys 2/3 after key 1's quota)
        # Census channels are saved from 5k subs; under that almost none pass the views floor.
        run: npm run score:quality -- --all-countries --min-subs 5000 --min-lifetime-views 3000 --limit "${{ inputs.score_limit || '11000' }}" --max-units "${{ inputs.score_units || '12000' }}"
